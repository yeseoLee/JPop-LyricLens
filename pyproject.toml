[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyriclens"
version = "0.1.0"
description = "일본어 가사 다국어 검색 RAG 서비스"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "live: 실제 네트워크·LLM을 호출하는 테스트 (CI 제외)",
    "e2e: 실제 브라우저로 앱을 조작하는 테스트 (CI 제외, 키·색인 필요)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
