# 검색·답변 품질에 영향을 주는 값은 여기서만 바꾼다 (docs/SPEC.md §4)
llm:
  base_url: https://gms.ssafy.io/gmsapi/api.openai.com/v1/
  chat_model: gpt-6-luna      # 최종 답변·구절 해석
  aux_model: gpt-5.4-nano     # 보조 작업: 검색어 추출·후보 선별·조건 탐색·일본어 변환 (D-11)
  aux_temperature: 0
  embedding_model: text-embedding-3-large
  temperature: null  # null이면 모델 기본값 (gpt-6-luna는 0 미지원)
chunking:
  chunk_size: 1000        # 위키 청크 크기(자)
  chunk_overlap: 200
  lyrics_chunk_lines: 8   # 가사 연 청크 최대 줄 수
  item_text_max_chars: 6000
retrieval:
  wiki_top_k: 5
  lyrics_top_k: 3
  search_type: similarity # similarity | mmr
  mmr_fetch_k: 20
  condition_candidates: 20
  phrase_search_top_k: 10
collect:
  max_queries: 4
  candidates_per_query: 5
  min_doc_chars: 200
  primary_verify_limit: 3   # 번역 제목 곡 문서 확인 시 본문을 볼 후보 수 (SPEC-013)
  request_interval_sec: 1.0  # 위키백과 호출 간격
  max_retries: 3
crawl:
  request_interval_sec: 3.0  # utaten 호출 간격
  max_retries: 3
  songs_per_artist: 6
display:
  lyrics_quote_max_lines: 4
paths:
  songs: data/songs.jsonl
  raw_html: data/raw
  chroma: data/chroma
  collect_cache: data/cache/collected.json
  docs_bundle: data/docs_bundle
  artists: config/artists.yaml

bench:
  judge_model: gpt-6-luna   # 답변 품질 LLM 판정 모델 (SPEC-015 §4.2)
